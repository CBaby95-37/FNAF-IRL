<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNAF IRL - SECURITY SYSTEM</title>
    <!-- PeerJS Library for P2P Video -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --fnaf-red: #8b0000;
            --fnaf-green: #00ff41;
        }

        body { 
            background: #000; 
            color: var(--fnaf-green); 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
            margin: 0; 
            text-transform: uppercase;
        }

        /* --- SETUP SCREEN --- */
        #setup { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            text-align: center;
            background: radial-gradient(circle, #111 0%, #000 100%);
        }

        .box {
            border: 2px solid var(--fnaf-green);
            padding: 20px;
            margin: 10px;
            background: rgba(0, 20, 0, 0.5);
            width: 300px;
        }

        input { 
            background: #000; 
            border: 1px solid var(--fnaf-green); 
            color: var(--fnaf-green); 
            padding: 8px; 
            width: 80%; 
            margin-bottom: 10px;
            text-align: center;
        }

        button { 
            background: var(--fnaf-green); 
            color: #000; 
            border: none; 
            padding: 10px 20px; 
            font-weight: bold; 
            cursor: pointer;
            width: 100%;
        }

        button:hover { background: #fff; }

        /* --- MONITOR INTERFACE --- */
        #monitor-ui { 
            display: none; 
            grid-template-columns: 1fr 200px; 
            height: 100vh; 
        }

        #screen { 
            position: relative; 
            background: #050505; 
            border-right: 2px solid #333; 
            overflow: hidden; 
        }

        #video-feed { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: grayscale(0.3) brightness(1.2) contrast(1.2);
        }

        /* Scanlines Effect */
        #screen::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 5; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        /* CRT Vignette */
        .vignette {
            position: absolute; top:0; left:0; width:100%; height:100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8); z-index: 6; pointer-events: none;
        }

        #static-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/oEI9uWUicG3II/giphy.gif');
            opacity: 0.05; z-index: 4; pointer-events: none;
        }

        #cam-label {
            position: absolute; top: 30px; left: 30px; z-index: 10;
            font-size: 2rem; text-shadow: 2px 2px #000;
        }

        #recording-dot {
            position: absolute; top: 35px; right: 30px; z-index: 10;
            color: red; font-size: 1.5rem; animation: blink 1s infinite;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        /* --- SIDEBAR --- */
        #controls { background: #111; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-left: 2px solid var(--fnaf-green); }
        .cam-btn { 
            background: #222; color: var(--fnaf-green); border: 1px solid var(--fnaf-green); 
            padding: 15px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 1rem;
        }
        .cam-btn:hover { background: var(--fnaf-green); color: #000; }
        .cam-btn.active { background: var(--fnaf-red); color: white; border-color: white; }

    </style>
</head>
<body>

    <!-- SETUP SCREEN -->
    <div id="setup">
        <h1 style="color:white; letter-spacing: 5px;">Fazbear Surveillance</h1>
        <p>SYSTEM ID: <span id="my-id" style="color:white; font-weight:bold;">connecting...</span></p>

        <div class="box">
            <h3>Camera Node</h3>
            <button onclick="startCamera()">INITIATE CAMERA</button>
        </div>

        <div class="box">
            <h3>Office Monitor</h3>
            <input type="text" id="peer-id-input" placeholder="ENTER PHONE ID">
            <button onclick="connectToCamera()">ADD FEED</button>
            <button onclick="showMonitor()" style="margin-top:10px; background: var(--fnaf-red); color: white;">START SHIFT</button>
        </div>
    </div>

    <!-- MONITOR INTERFACE -->
    <div id="monitor-ui">
        <div id="screen">
            <div id="cam-label">CAM 1</div>
            <div id="recording-dot">● REC</div>
            <div id="static-overlay"></div>
            <div class="vignette"></div>
            <video id="video-feed" autoplay playsinline muted></video>
        </div>
        <div id="controls">
            <h3 style="text-align: center; border-bottom: 1px solid var(--fnaf-green); padding-bottom: 10px;">MAP NODES</h3>
            <div id="btn-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
    </div>

    <script>
        const peer = new Peer(); 
        let activeStreams = {};
        let dummyStream = null;

        // Create a fake stream so the Monitor can "call" the Camera without needing a camera itself
        function createDummyStream() {
            const canvas = document.createElement('canvas');
            canvas.width = 10; canvas.height = 10;
            return canvas.captureStream(1);
        }

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
            dummyStream = createDummyStream();
        });

        // --- CAMERA ROLE (PHONE) ---
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                
                // When the PC calls, give it the phone video
                peer.on('call', (call) => {
                    call.answer(stream);
                });
                
                alert("NODE ONLINE. Leave this screen open and copy the ID to your PC.");
            } catch (err) {
                alert("CAMERA ERROR: Check permissions.");
            }
        }

        // --- MONITOR ROLE (PC) ---
        function connectToCamera() {
            const remoteId = document.getElementById('peer-id-input').value.trim();
            if(!remoteId) return;

            // We call the phone, sending our dummy stream
            const call = peer.call(remoteId, dummyStream);
            
            call.on('stream', (remoteStream) => {
                const camNum = Object.keys(activeStreams).length + 1;
                const label = `CAM 0${camNum}`;
                
                activeStreams[label] = remoteStream;
                addCamButton(label);
                
                document.getElementById('peer-id-input').value = "";
                alert(label + " CONNECTED");
            });

            call.on('error', (err) => alert("Connection Failed: " + err));
        }

        function addCamButton(label) {
            const btn = document.createElement('button');
            btn.className = 'cam-btn';
            btn.id = 'btn-' + label;
            btn.innerText = label;
            btn.onclick = () => switchCam(label);
            document.getElementById('btn-container').appendChild(btn);
        }

        function switchCam(label) {
            const video = document.getElementById('video-feed');
            const staticOverlay = document.getElementById('static-overlay');
            
            // UI Feedback
            document.getElementById('cam-label').innerText = label;
            document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + label).classList.add('active');

            // Set Stream
            video.srcObject = activeStreams[label];

            // FNAF Glitch Effect
            staticOverlay.style.opacity = "0.7";
            setTimeout(() => { 
                staticOverlay.style.opacity = "0.05"; 
            }, 300);
        }

        function showMonitor() {
            if (Object.keys(activeStreams).length === 0) {
                alert("No cameras connected!");
                return;
            }
            document.getElementById('setup').style.display = 'none';
            document.getElementById('monitor-ui').style.display = 'grid';
            switchCam(Object.keys(activeStreams)[0]);
        }
    </script>
</body>
</html>
