<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazbear OS - Surveillance</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --fnaf-green: #00ff41; --fnaf-red: #8b0000; }
        body { background: #000; color: var(--fnaf-green); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; text-transform: uppercase; }
        
        /* Setup Screen */
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; }
        .menu-box { border: 2px solid var(--fnaf-green); padding: 30px; background: rgba(0,20,0,0.4); text-align: center; width: 300px; }
        input { background: #000; border: 1px solid var(--fnaf-green); color: var(--fnaf-green); padding: 10px; width: 80%; text-align: center; font-size: 1.2rem; margin-bottom: 10px; }
        button { background: var(--fnaf-green); color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        button:hover { background: #fff; }

        /* Monitor UI */
        #monitor-ui { display: none; grid-template-columns: 1fr 220px; height: 100vh; }
        #screen { position: relative; background: #050505; overflow: hidden; border-right: 2px solid #222; }
        #video-feed { width: 100%; height: 100%; object-fit: cover; filter: brightness(1.2) contrast(1.1) sepia(0.2); }
        
        /* Overlays */
        .overlay { position: absolute; pointer-events: none; z-index: 10; }
        #static { top:0; left:0; width:100%; height:100%; background:url('https://media.giphy.com/media/oEI9uWUicG3II/giphy.gif'); opacity: 0.05; }
        #cam-label { top: 30px; left: 30px; font-size: 2.5rem; text-shadow: 2px 2px #000; }
        #session-code-display { bottom: 20px; left: 20px; font-size: 1.2rem; background: rgba(0,0,0,0.7); padding: 5px 10px; border: 1px solid var(--fnaf-green); }
        
        /* Map/Buttons */
        #sidebar { background: #111; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .cam-btn { background: #222; color: var(--fnaf-green); border: 1px solid var(--fnaf-green); padding: 15px; cursor: pointer; text-align: left; }
        .cam-btn.active { background: var(--fnaf-red); color: #fff; border-color: #fff; }
        #no-cams-msg { color: #555; text-align: center; margin-top: 50px; font-style: italic; }

        /* CRT Effect */
        #screen::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 15; background-size: 100% 3px, 3px 100%;
        }
    </style>
</head>
<body>

    <div id="setup">
        <h1 style="letter-spacing: 10px;">FAZBEAR SURVEILLANCE</h1>
        <div class="menu-box">
            <button onclick="initMonitor()">ACT AS MONITOR</button>
            <p style="font-size: 0.8rem; opacity: 0.7; margin-top: 10px;">(Start here to get your code)</p>
        </div>
        <div class="menu-box">
            <input type="number" id="join-code" placeholder="ENTER 6-DIGIT CODE">
            <button onclick="initCamera()" style="background: #444; color: white;">ACT AS CAMERA</button>
        </div>
    </div>

    <div id="monitor-ui">
        <div id="screen">
            <div id="cam-label" class="overlay">OFFLINE</div>
            <div id="static" class="overlay"></div>
            <div id="session-code-display" class="overlay">CODE: ------</div>
            <video id="video-feed" autoplay playsinline muted></video>
        </div>
        <div id="sidebar">
            <h3 style="text-align:center; border-bottom:1px solid #333; padding-bottom:10px;">CAMERA SYSTEM</h3>
            <div id="btn-container">
                <div id="no-cams-msg">Waiting for nodes to connect...</div>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let activeStreams = {};
        const ID_PREFIX = "fnaf-system-"; // Keeps IDs unique globally

        // --- MONITOR LOGIC ---
        function initMonitor() {
            // 1. Generate random 6-digit code
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            
            // 2. Initialize Peer with that code
            peer = new Peer(ID_PREFIX + code);

            peer.on('open', (id) => {
                document.getElementById('setup').style.display = 'none';
                document.getElementById('monitor-ui').style.display = 'grid';
                document.getElementById('session-code-display').innerText = `CODE: ${code}`;
                console.log("Monitor started with code: " + code);
            });

            // 3. Listen for incoming cameras
            peer.on('call', (call) => {
                call.answer(); // No need to send video back
                call.on('stream', (remoteStream) => {
                    handleNewCamera(call.peer, remoteStream);
                });
            });

            peer.on('error', (err) => {
                if(err.type === 'unavailable-id') {
                    alert("Code collision! Try clicking Monitor again.");
                    location.reload();
                }
            });
        }

        function handleNewCamera(peerId, stream) {
            const camId = `CAM-${Object.keys(activeStreams).length + 1}`;
            activeStreams[camId] = stream;

            // Remove "Waiting" message
            const msg = document.getElementById('no-cams-msg');
            if(msg) msg.remove();

            // Add button
            const btn = document.createElement('button');
            btn.className = 'cam-btn';
            btn.id = 'btn-' + camId;
            btn.innerText = `> ${camId} [ONLINE]`;
            btn.onclick = () => switchCam(camId);
            document.getElementById('btn-container').appendChild(btn);

            // Auto-switch to first camera if nothing is playing
            if(Object.keys(activeStreams).length === 1) {
                switchCam(camId);
            }
        }

        // --- CAMERA LOGIC ---
        async function initCamera() {
            const code = document.getElementById('join-code').value.trim();
            if(code.length !== 6) return alert("Enter a valid 6-digit code.");

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });

                peer = new Peer(); // Random ID for phone
                peer.on('open', () => {
                    const call = peer.call(ID_PREFIX + code, stream);
                    alert("CONNECTED. Keep this screen on.");
                });
            } catch (err) {
                alert("Camera Error: " + err.message);
            }
        }

        // --- UI HELPERS ---
        function switchCam(id) {
            const video = document.getElementById('video-feed');
            const staticOverlay = document.getElementById('static');
            
            document.getElementById('cam-label').innerText = id;
            document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + id).classList.add('active');

            video.srcObject = activeStreams[id];
            
            // Glitch Effect
            staticOverlay.style.opacity = "0.8";
            setTimeout(() => staticOverlay.style.opacity = "0.05", 400);
        }
    </script>
</body>
</html>
