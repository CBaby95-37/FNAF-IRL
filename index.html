<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fazbear Surveillance - v8.0 Audio</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --fnaf-green: #00ff41; --fnaf-red: #8b0000; --fnaf-blue: #0041ff; --fnaf-yellow: #f1c40f; }
        body { background: #000; color: var(--fnaf-green); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; text-transform: uppercase; }
        
        /* Setup */
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; }
        .menu-box { border: 2px solid var(--fnaf-green); padding: 30px; background: rgba(0,20,0,0.4); text-align: center; width: 300px; }
        input { background: #000; border: 1px solid var(--fnaf-green); color: var(--fnaf-green); padding: 10px; width: 80%; text-align: center; font-size: 1.2rem; margin-bottom: 10px; }
        button { background: var(--fnaf-green); color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        
        /* Monitor UI */
        #monitor-ui { display: none; grid-template-columns: 1fr 240px; height: 100vh; }
        #screen { position: relative; background: #050505; overflow: hidden; border-right: 2px solid #222; }
        #video-feed { width: 100%; height: 100%; object-fit: cover; filter: brightness(1.2) contrast(1.1) sepia(0.2); }
        #static-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.08; pointer-events: none; z-index: 10; }
        .overlay { position: absolute; pointer-events: none; z-index: 12; }
        #cam-label { top: 30px; left: 30px; font-size: 2.5rem; text-shadow: 2px 2px #000; }
        #signal-lost-text { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; color: white; text-shadow: 0 0 10px red; display: none; }
        
        /* Sidebar */
        #sidebar { background: #111; padding: 10px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid #333; overflow-y: auto; }
        .node-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .cam-btn { background: #222; color: var(--fnaf-green); border: 1px solid var(--fnaf-green); padding: 10px; cursor: pointer; text-align: left; flex-grow: 1; }
        .cam-btn.active { background: var(--fnaf-red); color: #fff; }
        .mic-btn { background: #333; color: #777; border: 1px solid #444; padding: 8px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }
        .mic-btn.on { background: var(--fnaf-yellow); color: #000; border-color: #fff; }

        /* Camera UI */
        #camera-ui { display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center; background: #000; text-align: center; }
        .watched-indicator { color: var(--fnaf-red); font-size: 1.2rem; visibility: hidden; animation: blink 1s infinite; margin: 10px; }
        #stealth-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="setup">
        <h1 style="letter-spacing: 5px;">FAZBEAR SURVEILLANCE</h1>
        <div class="menu-box"><button onclick="initMonitor()">ACT AS MONITOR</button></div>
        <div class="menu-box">
            <input type="number" id="join-code" placeholder="6-DIGIT CODE">
            <button onclick="initCamera()">ACT AS CAMERA</button>
        </div>
    </div>

    <!-- Monitor Interface -->
    <div id="monitor-ui">
        <div id="screen">
            <div id="cam-label" class="overlay">OFFLINE</div>
            <div id="signal-lost-text" class="overlay">SIGNAL LOST</div>
            <canvas id="static-canvas" class="overlay"></canvas>
            <!-- Important: video-feed is NOT muted here so we can hear audio -->
            <video id="video-feed" autoplay playsinline></video>
        </div>
        <div id="sidebar">
            <h3 style="text-align:center; font-size: 0.9rem;">NODES / AUDIO</h3>
            <div id="btn-container"></div>
        </div>
        <!-- Hidden container for background audio streams -->
        <div id="audio-vault" style="display:none;"></div>
    </div>

    <!-- Camera Interface -->
    <div id="camera-ui">
        <h2 id="my-node-label" style="font-size: 1rem;">NODE: PENDING</h2>
        <div id="watched-dot" class="watched-indicator">● LIVE FEED ACTIVE</div>
        <button onclick="enableStealth()" style="background: var(--fnaf-blue); color: white; width: 80%; padding: 20px;">ENABLE STEALTH</button>
        <p style="font-size: 0.6rem; opacity: 0.4; margin-top: 20px;">Mic and Camera are LIVE</p>
    </div>

    <div id="stealth-screen" onclick="disableStealth()"></div>

    <script>
        let peer = null;
        let activeStreams = {};
        let activeConnections = {};
        let nodeData = {};
        let currentActiveLabel = null;
        let isMonitor = false;
        const ID_PREFIX = "fnaf-sys-";

        // --- MONITOR ONLY: STATIC GENERATOR ---
        function startStaticLoop() {
            const canvas = document.getElementById('static-canvas');
            const ctx = canvas.getContext('2d');
            function noise() {
                if (!isMonitor) return;
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                const idata = ctx.createImageData(canvas.width, canvas.height);
                const buffer32 = new Uint32Array(idata.data.buffer);
                const isLost = document.getElementById('signal-lost-text').style.display === 'block';
                for (let i = 0; i < buffer32.length; i++) if (Math.random() < (isLost ? 0.8 : 0.5)) buffer32[i] = 0xffffffff;
                ctx.putImageData(idata, 0, 0);
                requestAnimationFrame(noise);
            }
            noise();
        }

        // --- MONITOR ROLE ---
        function initMonitor() {
            isMonitor = true;
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            peer = new Peer(ID_PREFIX + code);
            
            peer.on('open', () => {
                document.getElementById('setup').style.display = 'none';
                document.getElementById('monitor-ui').style.display = 'grid';
                alert("OFFICE CODE: " + code);
                startStaticLoop();
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (stream) => {
                    const existingNode = nodeData[call.peer];
                    if (existingNode) {
                        activeStreams[existingNode.label] = stream;
                        existingNode.row.style.opacity = "1";
                        if (currentActiveLabel === existingNode.label) switchCam(existingNode.label);
                    } else {
                        const label = `CAM-0${Object.keys(nodeData).length + 1}`;
                        activeStreams[label] = stream;
                        const row = createNodeRow(label, call.peer);
                        nodeData[call.peer] = { label, row };
                        // Ensure audio starts disabled to avoid a jump-scare of noise
                        if (stream.getAudioTracks().length > 0) {
                            stream.getAudioTracks()[0].enabled = false;
                        }
                        if (!currentActiveLabel) switchCam(label);
                    }
                });
            });

            peer.on('connection', (conn) => {
                activeConnections[conn.peer] = conn;
                conn.on('open', () => {
                    const label = nodeData[conn.peer]?.label || "CAM-??";
                    conn.send({ type: 'ASSIGN', label: label });
                });
                conn.on('close', () => {
                    const data = nodeData[conn.peer];
                    if (data) data.row.style.opacity = "0.3";
                    if (currentActiveLabel === data?.label) showSignalLost(true);
                    delete activeConnections[conn.peer];
                });
            });
        }

        function createNodeRow(label, pId) {
            const container = document.getElementById('btn-container');
            const row = document.createElement('div');
            row.className = 'node-row';
            
            const camBtn = document.createElement('button');
            camBtn.className = 'cam-btn';
            camBtn.id = 'btn-' + label;
            camBtn.innerText = "> " + label;
            camBtn.onclick = () => switchCam(label);
            
            const micBtn = document.createElement('button');
            micBtn.className = 'mic-btn';
            micBtn.id = 'mic-' + label;
            micBtn.innerText = "MIC: OFF";
            micBtn.onclick = () => toggleMic(label);
            
            row.appendChild(camBtn);
            row.appendChild(micBtn);
            container.appendChild(row);
            return row;
        }

        function toggleMic(label) {
            const stream = activeStreams[label];
            const micBtn = document.getElementById('mic-' + label);
            if (stream && stream.getAudioTracks().length > 0) {
                const track = stream.getAudioTracks()[0];
                track.enabled = !track.enabled;
                micBtn.innerText = track.enabled ? "MIC: LIVE" : "MIC: OFF";
                micBtn.classList.toggle('on', track.enabled);
            } else {
                alert("No audio track detected for this node.");
            }
        }

        function switchCam(label) {
            currentActiveLabel = label;
            const pId = Object.keys(nodeData).find(k => nodeData[k].label === label);
            
            if (!activeConnections[pId]) {
                showSignalLost(true);
            } else {
                showSignalLost(false);
                const video = document.getElementById('video-feed');
                video.srcObject = activeStreams[label];
                Object.values(activeConnections).forEach(c => c.send({ type: 'WATCH', id: label }));
            }
            
            document.getElementById('cam-label').innerText = label;
            document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + label);
            if(activeBtn) activeBtn.classList.add('active');
        }

        function showSignalLost(lost) {
            document.getElementById('video-feed').style.display = lost ? 'none' : 'block';
            document.getElementById('signal-lost-text').style.display = lost ? 'block' : 'none';
            document.getElementById('static-canvas').style.opacity = lost ? "0.5" : "0.08";
        }

        // --- CAMERA ROLE ---
        async function initCamera() {
            const code = document.getElementById('join-code').value;
            if (code.length !== 6) return alert("Enter the 6-digit monitor code.");

            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');

                // Request Audio and Video together
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true, 
                        noiseSuppression: true,
                        autoGainControl: true 
                    },
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });

                let pId = localStorage.getItem('fnaf_p_id') || 'n-' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('fnaf_p_id', pId);

                peer = new Peer(pId);
                peer.on('open', () => {
                    document.getElementById('setup').style.display = 'none';
                    document.getElementById('camera-ui').style.display = 'flex';
                    
                    peer.call(ID_PREFIX + code, stream);
                    const conn = peer.connect(ID_PREFIX + code);
                    
                    conn.on('data', (data) => {
                        if (data.type === 'ASSIGN') document.getElementById('my-node-label').innerText = "NODE: " + data.label;
                        if (data.type === 'WATCH') {
                            const myLabel = document.getElementById('my-node-label').innerText.split(': ')[1];
                            document.getElementById('watched-dot').style.visibility = (data.id === myLabel) ? 'visible' : 'hidden';
                        }
                    });
                });
                
                peer.on('error', (err) => alert("Connection Error: " + err.type));
            } catch (e) { 
                alert("Permission Denied: Ensure you allow both Camera AND Microphone access."); 
            }
        }

        function enableStealth() {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            document.getElementById('stealth-screen').style.display = 'block';
        }
        function disableStealth() {
            if (document.exitFullscreen) document.exitFullscreen();
            document.getElementById('stealth-screen').style.display = 'none';
        }
    </script>
</body>
</html>
