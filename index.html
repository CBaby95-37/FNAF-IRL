<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="version" content="20251228-2100">
    <title>Fazbear Surveillance - v12.0</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --fnaf-green: #00ff41; --fnaf-red: #8b0000; --fnaf-blue: #0041ff; --fnaf-yellow: #f1c40f; }
        body { background: #000; color: var(--fnaf-green); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; text-transform: uppercase; }
        
        /* Setup */
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; }
        .menu-box { border: 2px solid var(--fnaf-green); padding: 30px; background: rgba(0,20,0,0.4); text-align: center; width: 300px; }
        input { background: #000; border: 1px solid var(--fnaf-green); color: var(--fnaf-green); padding: 10px; width: 80%; text-align: center; font-size: 1.2rem; margin-bottom: 10px; }
        button { background: var(--fnaf-green); color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        
        /* Monitor UI */
        #monitor-ui { display: none; grid-template-columns: 1fr 220px; height: 100vh; }
        #screen { position: relative; background: #050505; overflow: hidden; border-right: 2px solid #222; }
        #video-feed { width: 100%; height: 100%; object-fit: cover; filter: brightness(1.2) contrast(1.1) sepia(0.2); }
        #static-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.08; pointer-events: none; z-index: 10; }
        
        /* Clock Display */
        #clock-display { position: absolute; top: 30px; right: 30px; font-size: 3rem; color: #fff; text-shadow: 0 0 10px #fff; z-index: 20; }
        #cam-label { position: absolute; top: 30px; left: 30px; font-size: 2rem; z-index: 20; text-shadow: 2px 2px #000; }
        
        /* Overlays */
        #signal-lost-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; color: white; text-shadow: 0 0 10px red; display: none; z-index: 25; }
        
        /* Sidebar */
        #sidebar { background: #111; padding: 10px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid #333; overflow-y: auto; }
        .cam-btn { background: #222; color: var(--fnaf-green); border: 1px solid var(--fnaf-green); padding: 15px; cursor: pointer; text-align: left; }
        .cam-btn.active { background: var(--fnaf-red); color: #fff; border-color: #fff; }
        #timer-control-btn { background: var(--fnaf-blue); color: white; margin-top: 10px; padding: 15px; }
        #timer-control-btn.running { background: var(--fnaf-red); }

        /* Camera UI */
        #camera-ui { display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center; background: #000; text-align: center; }
        #phone-clock { font-size: 3rem; color: #fff; margin-bottom: 20px; }
        .watched-indicator { color: var(--fnaf-red); font-size: 1.2rem; visibility: hidden; animation: blink 1s infinite; margin: 10px; }
        #stealth-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }

        /* 6 AM WIN SCREEN */
        #win-screen { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 10000; color: #fff; flex-direction: column; 
            align-items: center; justify-content: center; font-size: 5rem; font-weight: bold;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="setup">
        <h1 style="letter-spacing: 5px;">FAZBEAR SURVEILLANCE</h1>
        <div class="menu-box"><button onclick="initMonitor()">ACT AS MONITOR</button></div>
        <div class="menu-box">
            <input type="number" id="join-code" placeholder="6-DIGIT CODE">
            <button onclick="initCamera()">ACT AS CAMERA</button>
        </div>
    </div>

    <!-- Win Screen -->
    <div id="win-screen">
        <div style="font-size: 2rem;">5:59 AM</div>
        <div id="six-am-text" style="font-size: 8rem; margin: 20px 0;">6 AM</div>
        <div style="font-size: 1.5rem; color: var(--fnaf-green);">GREAT JOB!</div>
        <button onclick="location.reload()" style="width: auto; margin-top: 40px; padding: 10px 40px;">NEXT NIGHT</button>
    </div>

    <!-- Monitor Interface -->
    <div id="monitor-ui">
        <div id="screen">
            <div id="clock-display">12 AM</div>
            <div id="cam-label">OFFLINE</div>
            <div id="signal-lost-text">SIGNAL LOST</div>
            <canvas id="static-canvas"></canvas>
            <video id="video-feed" autoplay playsinline></video>
        </div>
        <div id="sidebar">
            <h3 style="text-align:center; font-size: 0.8rem;">CAMERA NODES</h3>
            <div id="btn-container"></div>
            <button id="timer-control-btn" onclick="toggleTimer()">START NIGHT (F4)</button>
            <button id="talk-btn" onmousedown="startTalk()" onmouseup="stopTalk()" ontouchstart="startTalk()" ontouchend="stopTalk()">HOLD TO TALK</button>
        </div>
    </div>

    <!-- Camera Interface -->
    <div id="camera-ui">
        <div id="phone-clock">12 AM</div>
        <h2 id="my-node-label" style="font-size: 1rem;">NODE: PENDING</h2>
        <div id="watched-dot" class="watched-indicator">● BEING WATCHED</div>
        <button onclick="enableStealth()" style="background: var(--fnaf-blue); color: white; width: 80%; padding: 20px;">ENABLE STEALTH</button>
        <audio id="intercom-audio" autoplay playsinline></audio>
    </div>

    <div id="stealth-screen" onclick="disableStealth()"></div>

    <script>
        let peer = null;
        let activeStreams = {};
        let activeConnections = {};
        let nodeData = {};
        let currentActiveLabel = null;
        let isMonitor = false;
        let monitorMicStream = null;
        const ID_PREFIX = "fnaf-sys-";

        // --- TIMER STATE ---
        let nightRunning = false;
        let startTime = null;
        let timerInterval = null;
        let currentHour = 12; // 12 AM

        function toggleTimer() {
            if (!isMonitor) return;
            nightRunning = !nightRunning;
            const btn = document.getElementById('timer-control-btn');
            
            if (nightRunning) {
                btn.innerText = "STOP NIGHT (F4)";
                btn.classList.add('running');
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
            } else {
                btn.innerText = "START NIGHT (F4)";
                btn.classList.remove('running');
                clearInterval(timerInterval);
            }
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutesElapsed = Math.floor(elapsed / 60);
            
            // FNAF logic: 0-59s = 12AM, 60-119s = 1AM, etc.
            let hour = 12;
            if (minutesElapsed > 0) hour = minutesElapsed;
            
            if (hour >= 6) {
                hour = 6;
                clearInterval(timerInterval);
                triggerWin();
            }

            if (hour !== currentHour) {
                currentHour = hour;
                const clockStr = `${currentHour} AM`;
                document.getElementById('clock-display').innerText = clockStr;
                // Sync to all phones
                Object.values(activeConnections).forEach(c => c.send({ type: 'TIME_SYNC', time: clockStr }));
            }
        }

        function triggerWin() {
            document.getElementById('win-screen').style.display = 'flex';
            // Also tell all phones it's 6 AM
            Object.values(activeConnections).forEach(c => c.send({ type: 'WIN' }));
        }

        // F4 Keybind
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F4') {
                e.preventDefault();
                toggleTimer();
            }
        });

        // --- MONITOR ONLY: STATIC GENERATOR ---
        function startStaticLoop() {
            const canvas = document.getElementById('static-canvas');
            const ctx = canvas.getContext('2d');
            function noise() {
                if (!isMonitor) return;
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                const idata = ctx.createImageData(canvas.width, canvas.height);
                const buffer32 = new Uint32Array(idata.data.buffer);
                const isLost = document.getElementById('signal-lost-text').style.display === 'block';
                for (let i = 0; i < buffer32.length; i++) if (Math.random() < (isLost ? 0.8 : 0.5)) buffer32[i] = 0xffffffff;
                ctx.putImageData(idata, 0, 0);
                requestAnimationFrame(noise);
            }
            noise();
        }

        // --- MONITOR ROLE ---
        async function initMonitor() {
            isMonitor = true;
            try {
                monitorMicStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true } });
                monitorMicStream.getAudioTracks()[0].enabled = false;
            } catch(e) { alert("Mic required for Intercom"); }

            const code = Math.floor(100000 + Math.random() * 900000).toString();
            peer = new Peer(ID_PREFIX + code);
            
            peer.on('open', () => {
                document.getElementById('setup').style.display = 'none';
                document.getElementById('monitor-ui').style.display = 'grid';
                alert("OFFICE CODE: " + code);
                startStaticLoop();
            });

            peer.on('call', (call) => {
                call.answer(monitorMicStream);
                call.on('stream', (stream) => {
                    const existingNode = nodeData[call.peer];
                    stream.getAudioTracks().forEach(t => t.enabled = false);
                    if (existingNode) {
                        activeStreams[existingNode.label] = stream;
                        existingNode.btn.classList.remove('lost');
                    } else {
                        const label = `CAM-0${Object.keys(nodeData).length + 1}`;
                        activeStreams[label] = stream;
                        const btn = createBtn(label, call.peer);
                        nodeData[call.peer] = { label, btn };
                        if (!currentActiveLabel) switchCam(label);
                    }
                });
            });

            peer.on('connection', (conn) => {
                activeConnections[conn.peer] = conn;
                conn.on('open', () => {
                    conn.send({ type: 'ASSIGN', label: nodeData[conn.peer]?.label || "CAM-??" });
                    // Sync current time immediately
                    conn.send({ type: 'TIME_SYNC', time: currentHour + " AM" });
                });
                conn.on('close', () => {
                    const data = nodeData[conn.peer];
                    if (data) data.btn.classList.add('lost');
                    if (currentActiveLabel === data?.label) showSignalLost(true);
                });
            });
        }

        function startTalk() {
            if (monitorMicStream) {
                monitorMicStream.getAudioTracks()[0].enabled = true;
                const btn = document.getElementById('talk-btn');
                btn.classList.add('active'); btn.innerText = "TALKING...";
            }
        }
        function stopTalk() {
            if (monitorMicStream) {
                monitorMicStream.getAudioTracks()[0].enabled = false;
                const btn = document.getElementById('talk-btn');
                btn.classList.remove('active'); btn.innerText = "HOLD TO TALK";
            }
        }

        function createBtn(label, pId) {
            const btn = document.createElement('button');
            btn.className = 'cam-btn'; btn.id = 'btn-' + label; btn.innerText = "> " + label;
            btn.onclick = () => switchCam(label);
            document.getElementById('btn-container').appendChild(btn);
            return btn;
        }

        function switchCam(label) {
            currentActiveLabel = label;
            const pId = Object.keys(nodeData).find(k => nodeData[k].label === label);
            Object.keys(activeStreams).forEach(k => activeStreams[k].getAudioTracks().forEach(t => t.enabled = (k === label)));
            if (!activeConnections[pId]) showSignalLost(true);
            else {
                showSignalLost(false);
                document.getElementById('video-feed').srcObject = activeStreams[label];
                Object.values(activeConnections).forEach(c => c.send({ type: 'WATCH', id: label }));
            }
            document.getElementById('cam-label').innerText = label;
            document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
            if(nodeData[pId]) nodeData[pId].btn.classList.add('active');
        }

        function showSignalLost(lost) {
            document.getElementById('video-feed').style.display = lost ? 'none' : 'block';
            document.getElementById('signal-lost-text').style.display = lost ? 'block' : 'none';
            document.getElementById('static-canvas').style.opacity = lost ? "0.5" : "0.08";
        }

        // --- CAMERA ROLE ---
        async function initCamera() {
            const code = document.getElementById('join-code').value;
            if (code.length !== 6) return;
            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: true, video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                peer = new Peer();
                peer.on('open', () => {
                    document.getElementById('setup').style.display = 'none';
                    document.getElementById('camera-ui').style.display = 'flex';
                    const call = peer.call(ID_PREFIX + code, stream);
                    call.on('stream', (rStream) => {
                        const audio = document.getElementById('intercom-audio');
                        audio.srcObject = rStream; audio.muted = true;
                    });
                    const conn = peer.connect(ID_PREFIX + code);
                    conn.on('data', (data) => {
                        if (data.type === 'ASSIGN') document.getElementById('my-node-label').innerText = "NODE: " + data.label;
                        if (data.type === 'TIME_SYNC') document.getElementById('phone-clock').innerText = data.time;
                        if (data.type === 'WIN') { 
                            document.getElementById('camera-ui').style.display = 'none'; 
                            document.getElementById('win-screen').style.display = 'flex';
                        }
                        if (data.type === 'WATCH') {
                            const myLabel = document.getElementById('my-node-label').innerText.split(': ')[1];
                            const isSelected = (data.id === myLabel);
                            document.getElementById('watched-dot').style.visibility = isSelected ? 'visible' : 'hidden';
                            document.getElementById('intercom-audio').muted = !isSelected;
                        }
                    });
                });
            } catch (e) { alert("Camera/Mic Permission required."); }
        }

        function enableStealth() {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            document.getElementById('stealth-screen').style.display = 'block';
        }
        function disableStealth() {
            if (document.exitFullscreen) document.exitFullscreen();
            document.getElementById('stealth-screen').style.display = 'none';
        }
    </script>
</body>
</html>
