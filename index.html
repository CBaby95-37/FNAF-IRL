<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fazbear Surveillance - Stability Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --fnaf-green: #00ff41; --fnaf-red: #8b0000; }
        body { background: #000; color: var(--fnaf-green); font-family: monospace; margin: 0; overflow: hidden; }
        
        /* Optimized Static: Use a CSS animation + a tiny base64 texture instead of a Canvas loop */
        .static-bg {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAADv7+9fX19/f3+Pj4+fn5+vr6+/v79Pz49fAAAACXBIWXMAAAsTAAALEwEAmpwYAAAARElEQVQ4y2NgQAX8DIzw0XvBCHvBCHvBCHvBCHvBCHvBCHvBCHvBCHvBCHvBCHvBCHvBCHvBCHvBCHvBCHvBCHvBCHvBCHsAADYIdwa9mY9oAAAAAElFTkSuQmCC");
            opacity: 0.1; pointer-events: none; z-index: 10;
            animation: noise 0.2s infinite steps(2);
        }
        @keyframes noise { 
            0% { transform: translate(0,0); } 
            10% { transform: translate(-1%,-1%); }
            20% { transform: translate(1%,1%); }
            100% { transform: translate(-2%,1%); }
        }

        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 15px; }
        .box { border: 1px solid var(--fnaf-green); padding: 20px; background: #050505; width: 280px; text-align: center; }
        button { background: var(--fnaf-green); color: #000; border: none; padding: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 5px; }
        input { background: #000; border: 1px solid var(--fnaf-green); color: #fff; padding: 10px; width: 80%; text-align: center; margin-bottom: 10px; }

        #monitor-ui { display: none; grid-template-columns: 1fr 180px; height: 100vh; }
        #screen { position: relative; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        #sidebar { background: #0a0a0a; padding: 10px; border-left: 1px solid #222; overflow-y: auto; }
        .cam-btn { background: #111; color: var(--fnaf-green); border: 1px solid #333; padding: 12px; width: 100%; margin-bottom: 5px; text-align: left; font-size: 0.8rem; }
        .cam-btn.active { background: var(--fnaf-red); color: white; }
        .cam-btn.lost { opacity: 0.4; }

        #stealth-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
    </style>
</head>
<body>

    <div id="setup">
        <h2 style="letter-spacing: 5px;">STABILITY OS</h2>
        <div class="box"><button onclick="initMonitor()">MONITOR MODE</button></div>
        <div class="box">
            <input type="number" id="join-code" placeholder="6-DIGIT CODE">
            <button onclick="initCamera()">CAMERA MODE</button>
            <button id="reconnect-btn" style="display:none; opacity:0.6;" onclick="reconnectLast()">QUICK RECONNECT</button>
        </div>
    </div>

    <div id="monitor-ui">
        <div id="screen">
            <div id="cam-label" style="position:absolute; top:20px; left:20px; z-index:15; font-size:1.5rem;">OFFLINE</div>
            <div class="static-bg" id="static"></div>
            <video id="video-feed" autoplay playsinline muted></video>
        </div>
        <div id="sidebar"><div id="btn-container"></div></div>
    </div>

    <div id="stealth-screen" onclick="disableStealth()"></div>

    <script>
        let peer = null;
        let activeStreams = {};
        let activeConns = {};
        let currentLabel = null;

        // Optimized Memory: Stop all tracks on a stream
        function killStream(stream) {
            if (!stream) return;
            stream.getTracks().forEach(track => track.stop());
        }

        // --- MONITOR ---
        function initMonitor() {
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            peer = new Peer('fnaf-' + code);
            peer.on('open', () => {
                document.getElementById('setup').style.display = 'none';
                document.getElementById('monitor-ui').style.display = 'grid';
                alert("OFFICE CODE: " + code);
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (stream) => {
                    const label = `CAM-0${Object.keys(activeStreams).length + 1}`;
                    // Clean up if this label already existed (reconnect)
                    if (activeStreams[label]) killStream(activeStreams[label]);
                    activeStreams[label] = stream;
                    updateUI(label);
                });
            });

            peer.on('connection', (conn) => {
                activeConns[conn.peer] = conn;
                conn.on('close', () => { 
                    const label = Object.keys(activeStreams).find(l => activeStreams[l]?.id === conn.peer);
                    if(label) document.getElementById('btn-'+label).classList.add('lost');
                });
            });
        }

        function updateUI(label) {
            if (document.getElementById('btn-'+label)) return;
            const btn = document.createElement('button');
            btn.className = 'cam-btn';
            btn.id = 'btn-'+label;
            btn.innerText = "> " + label;
            btn.onclick = () => switchCam(label);
            document.getElementById('btn-container').appendChild(btn);
            if (!currentLabel) switchCam(label);
        }

        function switchCam(label) {
            currentLabel = label;
            const video = document.getElementById('video-feed');
            video.srcObject = activeStreams[label];
            document.getElementById('cam-label').innerText = label;
            document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-'+label).classList.add('active');
            
            // Minimalist Flicker
            const s = document.getElementById('static');
            s.style.opacity = "0.6";
            setTimeout(() => s.style.opacity = "0.1", 200);
        }

        // --- CAMERA ---
        async function initCamera() {
            const code = document.getElementById('join-code').value;
            if (!code) return;

            try {
                // STABILITY FIX: Low-Res for Mobile (360p)
                // High-res causes mobile GPUs to overheat and crash browsers
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 640 }, 
                        height: { ideal: 360 },
                        frameRate: { ideal: 15 } // 15fps is enough for FNAF feel and saves 50% CPU
                    } 
                });

                peer = new Peer();
                peer.on('open', () => {
                    localStorage.setItem('fnaf_code', code);
                    peer.call('fnaf-' + code, stream);
                    peer.connect('fnaf-' + code);
                    document.getElementById('setup').innerHTML = "<h1>NODE ACTIVE</h1><button onclick='enableStealth()'>STEALTH MODE</button>";
                    if ('wakeLock' in navigator) navigator.wakeLock.request('screen');
                });
            } catch (e) { alert("Camera Error: Try refreshing"); }
        }

        function enableStealth() {
            document.getElementById('stealth-screen').style.display = 'block';
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        }
        function disableStealth() {
            document.getElementById('stealth-screen').style.display = 'none';
            if (document.exitFullscreen) document.exitFullscreen();
        }
        function reconnectLast() { initCamera(localStorage.getItem('fnaf_code')); }
        if(localStorage.getItem('fnaf_code')) document.getElementById('reconnect-btn').style.display = 'block';
    </script>
</body>
</html>
