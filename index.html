<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="version" content="20251229-MASTER">
    <title>Fazbear Surveillance - MASTER BUILD</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --fnaf-green: #00ff41; --fnaf-red: #8b0000; --fnaf-blue: #0041ff; --fnaf-yellow: #f1c40f; }
        body { background: #000; color: var(--fnaf-green); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; text-transform: uppercase; }
        
        /* Layouts */
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; text-align: center; }
        #monitor-ui { display: none; grid-template-columns: 1fr 240px; height: 100vh; }
        #camera-ui { display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center; background: #000; text-align: center; }
        
        /* UI Elements */
        .menu-box { border: 2px solid var(--fnaf-green); padding: 25px; background: rgba(0,20,0,0.4); width: 320px; }
        input, select { background: #000; border: 1px solid var(--fnaf-green); color: var(--fnaf-green); padding: 10px; width: 90%; text-align: center; font-size: 1rem; margin-bottom: 10px; }
        button { background: var(--fnaf-green); color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 5px; }
        
        /* Screen & Overlays */
        #screen { position: relative; background: #050505; overflow: hidden; border-right: 2px solid #222; }
        #video-feed { width: 100%; height: 100%; object-fit: cover; filter: brightness(1.2) contrast(1.1) sepia(0.2); }
        #static-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.08; pointer-events: none; z-index: 10; }
        #bonnie-overlay { position: absolute; bottom: 0; left: 5%; width: 35%; height: auto; z-index: 15; pointer-events: none; display: none; filter: brightness(0.6) contrast(1.2); }
        
        /* Jumpscare / Game Over */
        #jumpscare-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 20000; background: #000; }
        #jumpscare-gif { width: 100%; height: 100%; object-fit: cover; }
        #gameover-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 21000; flex-direction: column; align-items: center; justify-content: center; color: red; }

        /* HUD */
        #clock-display { position: absolute; top: 30px; right: 30px; font-size: 3.5rem; color: #fff; z-index: 20; text-shadow: 0 0 10px #fff; }
        #cam-label { position: absolute; top: 30px; left: 30px; font-size: 2.2rem; z-index: 20; }
        
        /* Shock System */
        #shock-btn { display: none; position: absolute; bottom: 10%; right: 5%; width: 150px; background: var(--fnaf-blue); color: white; border: 4px solid white; z-index: 30; animation: blink 0.5s infinite; padding: 20px; font-size: 1.5rem; }
        #shock-timer { display: none; position: absolute; bottom: 22%; right: 7%; font-size: 2.5rem; color: var(--fnaf-blue); z-index: 30; font-weight: bold; text-shadow: 0 0 10px #fff; }

        /* Sidebar */
        #sidebar { background: #111; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #333; overflow-y: auto; }
        .cam-btn { background: #222; color: var(--fnaf-green); border: 1px solid var(--fnaf-green); padding: 15px; cursor: pointer; text-align: left; }
        .cam-btn.active { background: var(--fnaf-red); color: #fff; border-color: #fff; }
        .cam-btn.lost { opacity: 0.3; color: #555; }

        #win-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; flex-direction: column; align-items: center; justify-content: center; color: #fff; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- SETUP -->
    <div id="setup">
        <h1 style="letter-spacing: 5px;">FAZBEAR SURVEILLANCE</h1>
        <div class="menu-box"><button onclick="initMonitor()">ACT AS MONITOR</button></div>
        <div class="menu-box">
            <input type="number" id="join-code" placeholder="6-DIGIT CODE">
            <button onclick="initCamera()">ACT AS CAMERA</button>
            <button id="reconnect-btn" style="display:none; background:#222; color:var(--fnaf-green);" onclick="reconnectLast()">QUICK RECONNECT</button>
        </div>
    </div>

    <!-- WIN SCREEN -->
    <div id="win-screen">
        <div style="font-size: 8rem; text-shadow: 0 0 20px #fff;">6 AM</div>
        <div style="font-size: 1.5rem; color: var(--fnaf-green);">GREAT JOB!</div>
        <button onclick="location.reload()" style="width: auto; margin-top: 30px; padding: 10px 40px;">NEXT NIGHT</button>
    </div>

    <!-- JUMPSCARE & GAME OVER -->
    <div id="jumpscare-overlay"><img id="jumpscare-gif" src=""></div>
    <div id="gameover-screen">
        <h1 style="font-size: 6rem;">GAME OVER</h1>
        <button onclick="location.reload()" style="width: auto; background: red; color: white; padding: 10px 40px;">TRY AGAIN</button>
    </div>

    <!-- MONITOR -->
    <div id="monitor-ui">
        <div id="screen">
            <div id="clock-display">12 AM</div>
            <div id="cam-label">OFFLINE</div>
            <div id="shock-timer">10</div>
            <button id="shock-btn" onclick="shockBonnie()">SHOCK</button>
            <canvas id="static-canvas"></canvas>
            <img id="bonnie-overlay" src="textures/bonnie.png">
            <video id="video-feed" autoplay playsinline></video>
        </div>
        <div id="sidebar">
            <select id="setting-bonnie-mode"><option value="robot">AI: ROBOT</option><option value="off">AI: OFF</option></select>
            <div id="btn-container"></div>
            <button id="timer-control-btn" onclick="toggleTimer()">START NIGHT (F4)</button>
            <button id="talk-btn" onmousedown="startTalk()" onmouseup="stopTalk()" ontouchstart="startTalk()" ontouchend="stopTalk()">HOLD TO TALK</button>
        </div>
    </div>

    <!-- CAMERA -->
    <div id="camera-ui">
        <div id="phone-clock" style="font-size: 3rem; color: #fff;">12 AM</div>
        <h2 id="my-node-label">NODE: PENDING</h2>
        <div id="watched-dot" style="color:red; visibility:hidden; font-weight:bold; animation: blink 1s infinite;">● BEING WATCHED</div>
        <button onclick="enableStealth()" style="background: var(--fnaf-blue); color: white; width: 80%; padding: 20px;">ENABLE STEALTH</button>
        <audio id="intercom-audio" autoplay playsinline></audio>
    </div>

    <div id="stealth-screen" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000; z-index:9999;" onclick="disableStealth()"></div>

    <script>
        let peer = null, activeStreams = {}, activeConns = {}, nodeData = {}, currentLabel = null;
        let isMonitor = false, monitorMicStream = null, nightRunning = false, startTime = null, timerInterval = null, currentHour = 12;
        let bonnieConfig = { mode: 'off', ai: 5, currentCam: null, interval: null, shockActive: false, timeLeft: 10, shockInt: null };
        const ID_PREFIX = "fnaf-sys-";
        const victorySound = new Audio('sounds/victory/fnaf1.mp3');
        const JUMPSCARE_URL = "https://static.wikia.nocookie.net/freddy-fazbears-pizza/images/3/31/Bonnie_blarg.gif/revision/latest/scale-to-width-down/1000?cb=20201222033919";

        window.onload = () => {
            if (localStorage.getItem('fnaf_last_code')) document.getElementById('reconnect-btn').style.display = 'block';
        };

        // --- MONITOR LOGIC ---
        async function initMonitor() {
            isMonitor = true;
            try { monitorMicStream = await navigator.mediaDevices.getUserMedia({ audio: true }); monitorMicStream.getAudioTracks()[0].enabled = false; } catch(e){}
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            peer = new Peer(ID_PREFIX + code);
            peer.on('open', () => {
                document.getElementById('setup').style.display = 'none';
                document.getElementById('monitor-ui').style.display = 'grid';
                alert("OFFICE CODE: " + code);
                startStaticLoop();
            });
            peer.on('call', (call) => {
                call.answer(monitorMicStream);
                call.on('stream', (stream) => {
                    const label = `CAM-0${Object.keys(nodeData).length + 1}`;
                    stream.getAudioTracks().forEach(t => t.enabled = false);
                    activeStreams[label] = stream;
                    const btn = document.createElement('button');
                    btn.className = 'cam-btn'; btn.id = 'btn-' + label; btn.innerText = "> " + label;
                    btn.onclick = () => switchCam(label);
                    document.getElementById('btn-container').appendChild(btn);
                    nodeData[call.peer] = { label, btn };
                    if (!currentLabel) switchCam(label);
                });
            });
            peer.on('connection', (conn) => {
                activeConns[conn.peer] = conn;
                conn.on('open', () => conn.send({ type: 'ASSIGN', label: nodeData[conn.peer]?.label || "CAM-??" }));
                conn.on('close', () => { if(nodeData[conn.peer]) nodeData[conn.peer].btn.classList.add('lost'); });
            });
        }

        function switchCam(label) {
            currentLabel = label;
            document.getElementById('video-feed').srcObject = activeStreams[label];
            document.getElementById('cam-label').innerText = label;
            Object.keys(activeStreams).forEach(k => activeStreams[k].getAudioTracks().forEach(t => t.enabled = (k === label)));
            document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
            if(document.getElementById('btn-'+label)) document.getElementById('btn-'+label).classList.add('active');
            checkBonnie();
            const pId = Object.keys(nodeData).find(k => nodeData[k].label === label);
            if(activeConns[pId]) activeConns[pId].send({ type: 'WATCH', id: label });
        }

        // --- TIMER & WIN ---
        function toggleTimer() {
            nightRunning = !nightRunning;
            const btn = document.getElementById('timer-control-btn');
            if (nightRunning) {
                startTime = Date.now(); currentHour = 12;
                btn.innerText = "STOP NIGHT (F4)"; btn.classList.add('running');
                timerInterval = setInterval(updateTimer, 1000);
                if (document.getElementById('setting-bonnie-mode').value === 'robot') startBonnieAI();
            } else {
                btn.innerText = "START NIGHT (F4)"; btn.classList.remove('running');
                clearInterval(timerInterval); stopBonnieAI();
            }
        }
        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            let hr = (mins === 0) ? 12 : mins;
            if (hr >= 6) { hr = 6; clearInterval(timerInterval); triggerWin(); }
            if (hr !== currentHour) {
                currentHour = hr; document.getElementById('clock-display').innerText = hr + " AM";
                Object.values(activeConns).forEach(c => c.send({ type: 'TIME_SYNC', time: hr + " AM" }));
            }
        }
        function triggerWin() {
            victorySound.play().catch(e=>{});
            document.getElementById('win-screen').style.display = 'flex';
            Object.values(activeConns).forEach(c => c.send({ type: 'WIN' }));
        }

        // --- BONNIE AI & JUMPSCARE ---
        function startBonnieAI() {
            clearInterval(bonnieConfig.interval);
            bonnieConfig.interval = setInterval(() => {
                if (bonnieConfig.shockActive) return;
                if (Math.floor(Math.random() * 20) + 1 <= 5) { // Difficulty 5
                    const keys = Object.keys(activeStreams);
                    if (keys.length > 0) {
                        bonnieConfig.currentCam = keys[Math.floor(Math.random()*keys.length)];
                        if (Math.random() > 0.6) triggerShock();
                        checkBonnie();
                    }
                }
            }, 5000);
        }
        function stopBonnieAI() { clearInterval(bonnieConfig.interval); clearInterval(bonnieConfig.shockInt); }
        function triggerShock() {
            bonnieConfig.shockActive = true; bonnieConfig.timeLeft = 10;
            document.getElementById('shock-btn').style.display = 'block';
            document.getElementById('shock-timer').style.display = 'block';
            bonnieConfig.shockInt = setInterval(() => {
                bonnieConfig.timeLeft--;
                document.getElementById('shock-timer').innerText = bonnieConfig.timeLeft;
                if (bonnieConfig.timeLeft <= 0) triggerJumpscare();
            }, 1000);
        }
        function shockBonnie() {
            bonnieConfig.shockActive = false; clearInterval(bonnieConfig.shockInt);
            document.getElementById('shock-btn').style.display = 'none';
            document.getElementById('shock-timer').style.display = 'none';
            bonnieConfig.currentCam = null; checkBonnie();
        }
        function triggerJumpscare() {
            const gif = document.getElementById('jumpscare-gif');
            gif.src = JUMPSCARE_URL + "&t=" + Date.now();
            document.getElementById('jumpscare-overlay').style.display = 'block';
            setTimeout(() => {
                document.getElementById('jumpscare-overlay').style.display = 'none';
                document.getElementById('gameover-screen').style.display = 'flex';
                Object.values(activeConns).forEach(c => c.send({ type: 'GAMEOVER' }));
            }, 2000);
            stopBonnieAI();
        }
        function checkBonnie() {
            document.getElementById('bonnie-overlay').style.display = (bonnieConfig.currentCam === currentLabel) ? 'block' : 'none';
        }

        // --- CAMERA LOGIC ---
        async function initCamera(reconnectCode = null) {
            const code = reconnectCode || document.getElementById('join-code').value;
            if (code.length !== 6) return;
            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: "environment" } });
                localStorage.setItem('fnaf_last_code', code);
                peer = new Peer();
                peer.on('open', () => {
                    document.getElementById('setup').style.display = 'none';
                    document.getElementById('camera-ui').style.display = 'flex';
                    const call = peer.call(ID_PREFIX + code, stream);
                    call.on('stream', (rs) => { document.getElementById('intercom-audio').srcObject = rs; document.getElementById('intercom-audio').muted = true; });
                    const conn = peer.connect(ID_PREFIX + code);
                    conn.on('data', (d) => {
                        if (d.type === 'ASSIGN') document.getElementById('my-node-label').innerText = "NODE: " + d.label;
                        if (d.type === 'TIME_SYNC') document.getElementById('phone-clock').innerText = d.time;
                        if (d.type === 'WIN') { victorySound.play().catch(e=>{}); document.getElementById('win-screen').style.display = 'flex'; }
                        if (d.type === 'GAMEOVER') document.getElementById('gameover-screen').style.display = 'flex';
                        if (d.type === 'WATCH') {
                            const myL = document.getElementById('my-node-label').innerText.split(': ')[1];
                            const watched = (d.id === myL);
                            document.getElementById('watched-dot').style.visibility = watched ? 'visible' : 'hidden';
                            document.getElementById('intercom-audio').muted = !watched;
                        }
                    });
                });
            } catch (e) { alert("Permission Error"); }
        }

        // --- HELPERS ---
        function startStaticLoop() {
            const canvas = document.getElementById('static-canvas'); const ctx = canvas.getContext('2d');
            function n() {
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                const id = ctx.createImageData(canvas.width, canvas.height); const b32 = new Uint32Array(id.data.buffer);
                for (let i=0; i<b32.length; i++) if (Math.random() < 0.5) b32[i] = 0xffffffff;
                ctx.putImageData(id, 0, 0); requestAnimationFrame(n);
            }
            n();
        }
        function startTalk() { if (monitorMicStream) monitorMicStream.getAudioTracks()[0].enabled = true; document.getElementById('talk-btn').classList.add('active'); }
        function stopTalk() { if (monitorMicStream) monitorMicStream.getAudioTracks()[0].enabled = false; document.getElementById('talk-btn').classList.remove('active'); }
        function reconnectLast() { initCamera(localStorage.getItem('fnaf_last_code')); }
        function enableStealth() { document.documentElement.requestFullscreen(); document.getElementById('stealth-screen').style.display = 'block'; }
        function disableStealth() { if (document.fullscreenElement) document.exitFullscreen(); document.getElementById('stealth-screen').style.display = 'none'; }
        window.addEventListener('keydown', (e) => { if (e.key === 'F4') toggleTimer(); });
    </script>
</body>
</html>
