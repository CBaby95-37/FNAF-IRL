<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="version" content="20251228-2500">
    <title>Fazbear Surveillance - v13.1</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --fnaf-green: #00ff41; --fnaf-red: #8b0000; --fnaf-blue: #0041ff; --fnaf-yellow: #f1c40f; }
        body { background: #000; color: var(--fnaf-green); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; text-transform: uppercase; }
        
        /* Setup & UI */
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; }
        .menu-box { border: 2px solid var(--fnaf-green); padding: 30px; background: rgba(0,20,0,0.4); text-align: center; width: 300px; }
        input, select { background: #000; border: 1px solid var(--fnaf-green); color: var(--fnaf-green); padding: 10px; width: 90%; text-align: center; font-size: 1rem; margin-bottom: 10px; }
        button { background: var(--fnaf-green); color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        
        /* Monitor UI */
        #monitor-ui { display: none; grid-template-columns: 1fr 220px; height: 100vh; }
        #screen { position: relative; background: #050505; overflow: hidden; border-right: 2px solid #222; }
        #video-feed { width: 100%; height: 100%; object-fit: cover; filter: brightness(1.2) contrast(1.1) sepia(0.2); }
        #static-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.08; pointer-events: none; z-index: 10; }
        
        /* Bonnie Overlay */
        #bonnie-overlay { 
            position: absolute; bottom: 0; left: 5%; width: 35%; height: auto; 
            z-index: 15; pointer-events: none; display: none;
            filter: brightness(0.7) contrast(1.2) grayscale(0.3);
            transition: opacity 0.5s;
        }

        /* HUD */
        #clock-display { position: absolute; top: 30px; right: 30px; font-size: 3rem; color: #fff; z-index: 20; text-shadow: 0 0 10px #fff; }
        #cam-label { position: absolute; top: 30px; left: 30px; font-size: 2rem; z-index: 20; text-shadow: 2px 2px #000; }

        /* Settings Overlay */
        #settings-overlay {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #111; border: 2px solid var(--fnaf-blue); padding: 25px; z-index: 11000; width: 320px;
            box-shadow: 0 0 20px var(--fnaf-blue);
        }

        /* Sidebar */
        #sidebar { background: #111; padding: 10px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid #333; overflow-y: auto; }
        .cam-btn { background: #222; color: var(--fnaf-green); border: 1px solid var(--fnaf-green); padding: 15px; cursor: pointer; text-align: left; }
        .cam-btn.active { background: var(--fnaf-red); color: #fff; border-color: #fff; }
        
        #win-screen { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 10000; color: #fff; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        .watched-indicator { color: var(--fnaf-red); font-size: 1.2rem; visibility: hidden; animation: blink 1s infinite; }
        #camera-ui { display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center; background: #000; text-align: center; }
        #stealth-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
    </style>
</head>
<body>

    <div id="setup">
        <h1 style="letter-spacing: 5px;">FAZBEAR SURVEILLANCE</h1>
        <div class="menu-box"><button onclick="initMonitor()">ACT AS MONITOR</button></div>
        <div class="menu-box">
            <input type="number" id="join-code" placeholder="6-DIGIT CODE">
            <button onclick="initCamera()">ACT AS CAMERA</button>
        </div>
    </div>

    <!-- Settings Menu -->
    <div id="settings-overlay">
        <h3 style="color: var(--fnaf-blue); margin-top: 0;">SYSTEM SETTINGS</h3>
        <label>BONNIE MODE:</label>
        <select id="setting-bonnie-mode">
            <option value="off">DISABLED</option>
            <option value="manual">MANUAL (PLAYER)</option>
            <option value="robot">ROBOT AI (AUTO)</option>
        </select>
        <br><br>
        <label>AI DIFFICULTY (1-20):</label>
        <input type="number" id="setting-bonnie-ai" value="5" min="0" max="20">
        <button onclick="closeSettings()" style="background: var(--fnaf-blue); color: white; margin-top: 10px;">SAVE & EXIT</button>
    </div>

    <!-- Win Screen -->
    <div id="win-screen">
        <div style="font-size: 8rem; text-shadow: 0 0 20px #fff;">6 AM</div>
        <button onclick="location.reload()" style="width: auto; padding: 10px 40px;">REBOOT SYSTEM</button>
    </div>

    <!-- Monitor UI -->
    <div id="monitor-ui">
        <div id="screen">
            <div id="clock-display">12 AM</div>
            <div id="cam-label">OFFLINE</div>
            <canvas id="static-canvas"></canvas>
            <!-- UPDATED PATH HERE -->
            <img id="bonnie-overlay" src="textures/bonnie.png" alt="Bonnie">
            <video id="video-feed" autoplay playsinline></video>
        </div>
        <div id="sidebar">
            <button onclick="openSettings()" style="background: #333; color: var(--fnaf-blue); font-size: 0.7rem; border: 1px solid var(--fnaf-blue);">SYSTEM SETTINGS</button>
            <div id="btn-container"></div>
            <button id="timer-control-btn" onclick="toggleTimer()">START NIGHT (F4)</button>
            <button id="talk-btn" onmousedown="startTalk()" onmouseup="stopTalk()" ontouchstart="startTalk()" ontouchend="stopTalk()">HOLD TO TALK</button>
        </div>
    </div>

    <!-- Camera UI -->
    <div id="camera-ui">
        <div id="phone-clock" style="font-size: 2rem;">12 AM</div>
        <h2 id="my-node-label" style="font-size: 1rem;">NODE: PENDING</h2>
        <div id="watched-dot" class="watched-indicator">● BEING WATCHED</div>
        <button onclick="enableStealth()" style="background: var(--fnaf-blue); color: white; width: 80%; padding: 20px;">ENABLE STEALTH</button>
        <audio id="intercom-audio" autoplay playsinline></audio>
    </div>

    <div id="stealth-screen" onclick="disableStealth()"></div>

    <script>
        let peer = null;
        let activeStreams = {};
        let activeConnections = {};
        let nodeData = {};
        let currentActiveLabel = null;
        let isMonitor = false;
        let monitorMicStream = null;
        const ID_PREFIX = "fnaf-sys-";

        // --- BONNIE STATE ---
        let bonnieConfig = { mode: 'off', ai: 5, currentCam: null };
        let bonnieMoveInterval = null;

        function openSettings() { document.getElementById('settings-overlay').style.display = 'block'; }
        function closeSettings() {
            bonnieConfig.mode = document.getElementById('setting-bonnie-mode').value;
            bonnieConfig.ai = parseInt(document.getElementById('setting-bonnie-ai').value);
            document.getElementById('settings-overlay').style.display = 'none';
            if (nightRunning && bonnieConfig.mode === 'robot') startBonnieAI();
            else if (bonnieConfig.mode !== 'robot') stopBonnieAI();
            checkBonniePresence();
        }

        function startBonnieAI() {
            stopBonnieAI();
            bonnieMoveInterval = setInterval(() => {
                if (bonnieConfig.mode !== 'robot') return;
                let roll = Math.floor(Math.random() * 20) + 1;
                if (roll <= bonnieConfig.ai) {
                    moveBonnie();
                }
            }, 5000);
        }

        function stopBonnieAI() { if(bonnieMoveInterval) clearInterval(bonnieMoveInterval); }

        function moveBonnie() {
            const camLabels = Object.keys(activeStreams);
            if (camLabels.length === 0) return;
            const newCam = camLabels[Math.floor(Math.random() * camLabels.length)];
            bonnieConfig.currentCam = newCam;
            checkBonniePresence();
        }

        function checkBonniePresence() {
            const overlay = document.getElementById('bonnie-overlay');
            if (bonnieConfig.mode === 'robot' && bonnieConfig.currentCam === currentActiveLabel) {
                overlay.style.display = 'block';
            } else {
                overlay.style.display = 'none';
            }
        }

        // --- TIMER ---
        let nightRunning = false;
        let startTime = null;
        let timerInterval = null;
        let currentHour = 12;

        function toggleTimer() {
            if (!isMonitor) return;
            nightRunning = !nightRunning;
            const btn = document.getElementById('timer-control-btn');
            if (nightRunning) {
                currentHour = 12; startTime = Date.now();
                btn.innerText = "STOP NIGHT (F4)";
                btn.classList.add('running');
                timerInterval = setInterval(updateTimer, 1000);
                if (bonnieConfig.mode === 'robot') startBonnieAI();
            } else {
                btn.innerText = "START NIGHT (F4)";
                btn.classList.remove('running');
                clearInterval(timerInterval);
                stopBonnieAI();
            }
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            let hour = (mins === 0) ? 12 : mins;
            if (mins >= 6) { hour = 6; clearInterval(timerInterval); triggerWin(); }
            if (hour !== currentHour) {
                currentHour = hour;
                document.getElementById('clock-display').innerText = `${currentHour} AM`;
                Object.values(activeConnections).forEach(c => c.send({ type: 'TIME_SYNC', time: currentHour + " AM" }));
            }
        }

        function triggerWin() {
            document.getElementById('win-screen').style.display = 'flex';
            Object.values(activeConnections).forEach(c => c.send({ type: 'WIN' }));
            stopBonnieAI();
        }

        window.addEventListener('keydown', (e) => { if (e.key === 'F4') toggleTimer(); });

        // --- MONITOR CORE ---
        function startStaticLoop() {
            const canvas = document.getElementById('static-canvas');
            const ctx = canvas.getContext('2d');
            function noise() {
                if (!isMonitor) return;
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                const idata = ctx.createImageData(canvas.width, canvas.height);
                const buffer32 = new Uint32Array(idata.data.buffer);
                for (let i = 0; i < buffer32.length; i++) if (Math.random() < 0.5) buffer32[i] = 0xffffffff;
                ctx.putImageData(idata, 0, 0);
                requestAnimationFrame(noise);
            }
            noise();
        }

        async function initMonitor() {
            isMonitor = true;
            try {
                monitorMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                monitorMicStream.getAudioTracks()[0].enabled = false;
            } catch(e) {}
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            peer = new Peer(ID_PREFIX + code);
            peer.on('open', (id) => {
                document.getElementById('setup').style.display = 'none';
                document.getElementById('monitor-ui').style.display = 'grid';
                alert("OFFICE CODE: " + code);
                startStaticLoop();
            });
            peer.on('call', (call) => {
                call.answer(monitorMicStream);
                call.on('stream', (stream) => {
                    const label = `CAM-0${Object.keys(nodeData).length + 1}`;
                    stream.getAudioTracks().forEach(t => t.enabled = false);
                    activeStreams[label] = stream;
                    const btn = document.createElement('button');
                    btn.className = 'cam-btn'; btn.id = 'btn-' + label; btn.innerText = "> " + label;
                    btn.onclick = () => switchCam(label);
                    document.getElementById('btn-container').appendChild(btn);
                    nodeData[call.peer] = { label, btn };
                    if (!currentActiveLabel) switchCam(label);
                });
            });
            peer.on('connection', (conn) => {
                activeConnections[conn.peer] = conn;
                conn.on('open', () => conn.send({ type: 'ASSIGN', label: nodeData[conn.peer]?.label || "CAM-??" }));
            });
        }

        function switchCam(label) {
            currentActiveLabel = label;
            document.getElementById('video-feed').srcObject = activeStreams[label];
            document.getElementById('cam-label').innerText = label;
            document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
            if(document.getElementById('btn-' + label)) document.getElementById('btn-' + label).classList.add('active');
            checkBonniePresence();
            const pId = Object.keys(nodeData).find(k => nodeData[k].label === label);
            if(activeConnections[pId]) activeConnections[pId].send({ type: 'WATCH', id: label });
        }

        function startTalk() { if (monitorMicStream) monitorMicStream.getAudioTracks()[0].enabled = true; }
        function stopTalk() { if (monitorMicStream) monitorMicStream.getAudioTracks()[0].enabled = false; }

        // --- CAMERA CORE ---
        async function initCamera() {
            const code = document.getElementById('join-code').value;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: "environment" } });
                peer = new Peer();
                peer.on('open', () => {
                    document.getElementById('setup').style.display = 'none';
                    document.getElementById('camera-ui').style.display = 'flex';
                    const call = peer.call(ID_PREFIX + code, stream);
                    call.on('stream', (rS) => { const a = document.getElementById('intercom-audio'); a.srcObject = rS; a.muted = true; });
                    const conn = peer.connect(ID_PREFIX + code);
                    conn.on('data', (d) => {
                        if (d.type === 'ASSIGN') document.getElementById('my-node-label').innerText = "NODE: " + d.label;
                        if (d.type === 'TIME_SYNC') document.getElementById('phone-clock').innerText = d.time;
                        if (d.type === 'WATCH') {
                            const myL = document.getElementById('my-node-label').innerText.split(': ')[1];
                            document.getElementById('watched-dot').style.visibility = (d.id === myL) ? 'visible' : 'hidden';
                            document.getElementById('intercom-audio').muted = (d.id !== myL);
                        }
                        if (d.type === 'WIN') document.getElementById('win-screen').style.display = 'flex';
                    });
                });
            } catch (e) { alert("Camera Permission Error"); }
        }

        function enableStealth() { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); document.getElementById('stealth-screen').style.display = 'block'; }
        function disableStealth() { if (document.exitFullscreen) document.exitFullscreen(); document.getElementById('stealth-screen').style.display = 'none'; }
    </script>
</body>
</html>
